name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to avoid an email flood.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Host tests and the deployed-binary adversarial audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # This repository was the only one of the family whose CI checked neither
      # formatting nor lints, and it had drifted: 23 unformatted spots across
      # seven files, plus a `needless_question_mark` clippy error. Both are fixed;
      # these steps are what stops them coming back. Clippy prints its own version
      # because the lint set moves between releases, and a lint that fires only in
      # CI is otherwise indistinguishable from a real regression.
      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Which clippy
        run: cargo clippy --version

      - name: Clippy, warnings are errors
        run: cargo clippy --workspace --all-targets -- -D warnings

      # claim-verifier-tests runs the committed ELF through risc0's executor,
      # which shells out to r0vm. Install it (no docker guest toolchain needed,
      # only the emulator).
      - name: Install r0vm
        run: |
          curl -L https://risczero.com/install | bash
          echo "$HOME/.risc0/bin" >> "$GITHUB_PATH"
          "$HOME/.risc0/bin/rzup" install r0vm 3.0.5

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      # airdrop-core carries the circuit-level adversarial audit; airdrop-cli the
      # distributor/claim tooling. claim-verifier-tests runs the committed
      # claim_verifier.bin through the sequencer's own executor and requires each
      # forgery to be rejected. All run on a stock runner: executing the ELF needs
      # no docker guest toolchain, only the risc0 emulator.
      - name: Build
        run: cargo build --workspace --release

      - name: Test
        run: cargo test --workspace --release

  # The guest and SPEL binaries are content-addressed and committed under
  # artifacts/programs/. Rebuilding them needs the risc0 docker toolchain and is
  # done locally; DEPLOYMENT.md records the reproduction. This job asserts the
  # committed binaries match their recorded ImageIDs, so a tampered binary fails
  # CI without a full guest rebuild.
  binaries:
    name: Committed binaries match their recorded ImageIDs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install spel
        run: |
          cargo install --locked --git https://github.com/logos-co/spel --tag v0.6.0 spel \
            || cargo install --git https://github.com/logos-co/spel --tag v0.6.0 spel
          command -v spel >/dev/null || { echo "spel not on PATH"; exit 1; }
      - name: Check ImageIDs
        run: |
          set -e
          check() {
            got=$(spel program-id "$1" | sed -n 's/.*ImageID (hex bytes):[[:space:]]*//p')
            if [ "$got" != "$2" ]; then
              echo "ImageID mismatch for $1: got $got expected $2"; exit 1
            fi
            echo "OK $1 $got"
          }
          check artifacts/programs/claim_lez.bin      e9843420155078b6103921df89d88f78fe84698d731a8914a68f701d67b57449
          check artifacts/programs/claim_verifier.bin 31edc17c350735a61205eb2c14164b3fa610df57e6c0c87e7180e5d4a110385d

  # A green run is the evidence for the criteria nobody re-runs: the end-to-end
  # lifecycle against a standalone sequencer with RISC0_DEV_MODE=0 takes over two
  # hours on a runner. What a reader does instead is follow the link — so the
  # link IS the deliverable, and one that lands on a commit this branch does not
  # contain reads as a history rewritten to hide something.
  #
  # `fetch-depth: 0` is load-bearing. The default depth-1 checkout leaves HEAD
  # with no ancestors, under which every citation looks orphaned and none of that
  # is true; the script refuses to run on a shallow clone rather than report it.
  citations:
    name: Every cited CI run is on a commit this branch has
    runs-on: ubuntu-latest
    # Stated rather than inherited. The gate asks the API which commit each
    # cited run sat on, so it needs `actions: read`; the repository default
    # grants it today, and a default is not a guarantee.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve every cited run through the GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e -o pipefail
          ./scripts/check-run-citations.py | tee citations.out
          # The coverage floor, for the same reason every other floor here
          # exists: "checked 0 cited run(s)" and "checked 4, all reachable" are
          # the same exit code, and the first one means the matcher stopped
          # seeing the documents rather than that the documents got cleaner.
          n=$(sed -n 's/^checked \([0-9][0-9]*\) cited CI run(s).*/\1/p' citations.out)
          [ -n "$n" ] || { echo "it printed no coverage line"; exit 1; }
          [ "$n" -ge 4 ] || { echo "it resolved $n citation(s), fewer than the 4 this repository ships"; exit 1; }

  # Documentation rots in three ways that are decidable from the tree alone: a
  # path in backticks that is not there, a link whose target does not resolve
  # from the document that carries it, and a line citation past the end of its
  # file. None of them needs judgement about what a sentence meant, so none of
  # them needs a human to notice.
  docs:
    name: The documentation points at things that exist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every quoted path, link and line citation resolves
        run: |
          set -e -o pipefail
          ./scripts/check-docs.py | tee docs.out
          # Floors, because every class here can pass by matching nothing: a
          # regex that stops seeing documents reports zero failures, which is
          # the same exit code and the same green tick as a clean tree.
          p=$(sed -n 's/^examined \([0-9]*\) repository path(s), \([0-9]*\) link(s).*/\1/p' docs.out)
          l=$(sed -n 's/^examined \([0-9]*\) repository path(s), \([0-9]*\) link(s).*/\2/p' docs.out)
          [ -n "$p" ] && [ -n "$l" ] || { echo "it printed no coverage line"; exit 1; }
          [ "$p" -ge 60 ] || { echo "only $p path(s) examined, under the floor of 60: the matcher is not seeing the documents"; exit 1; }
          [ "$l" -ge 15 ] || { echo "only $l link(s) examined, under the floor of 15: the matcher is not seeing the documents"; exit 1; }

  # The prize asks for a GUI "loadable in Logos app (Basecamp)". Shipping a
  # `.lgx` is not that claim, and until this job existed nothing in this
  # repository checked it: the darwin-arm64 variant had been loaded by hand once,
  # and the linux-amd64 variant inside the same package had been loaded by
  # nobody. A variant that ships and has never been loaded is a tile that will be
  # inert on somebody's machine, with the reason on a stderr they never see.
  #
  # WHAT IT RUNS AGAINST: the committed package, unpacked — not a rebuild. A
  # rebuild would test the source; what a reviewer installs is the `.lgx`.
  #
  # Qt 6.9.2 from aqtinstall rather than ubuntu's own: Basecamp bundles 6.9.2 and
  # Qt refuses a plugin whose minor version exceeds the host's, so ubuntu's 6.4
  # would refuse this plugin and the refusal would read as a defect in it.
  #
  # No liblogos_core here, unlike a plugin that leans on the host: this one names
  # `LogosAPI` only as an opaque pointer type, so it binds with RTLD_NOW on its
  # own — which the harness asserts rather than assumes, because "it loaded"
  # means a different thing for each design.
  basecamp-loads:
    name: The shipped module loads the way Basecamp loads a ui plugin
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # libgl1 and glib are not optional: official Qt's libQt6Gui and libQt6Core
      # reference glX* and g_main_context_* by soname, and without them the link
      # below fails inside Qt with "undefined reference to glXGetConfig", which
      # reads as a problem with the harness and is not.
      - name: What a bare runner does not have
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            --no-install-recommends \
            libgl1 libglx0 libopengl0 libegl1 libxkbcommon0 libfontconfig1 \
            libfreetype6 libdbus-1-3 libharfbuzz0b
          # glib carries the `t64` suffix since 24.04's time_t transition and did
          # not before it. Named both ways so an image bump does not break a step
          # that has nothing to do with it.
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            --no-install-recommends libglib2.0-0t64 \
            || sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
                 --no-install-recommends libglib2.0-0

      - name: Qt 6.9.2, the version Basecamp bundles
        run: |
          set -euo pipefail
          python3 -m venv /opt/aqt
          /opt/aqt/bin/pip -q install aqtinstall
          # qtdeclarative, not just qtbase: the shipped plugin embeds its QML in a
          # QQuickWidget, so its DT_NEEDED names libQt6Qml and libQt6QuickWidgets.
          # Measured, not guessed — the first run of this job installed qtbase alone
          # and the harness reported `libQt6QuickWidgets.so.6: cannot open shared
          # object file`, which reads as a broken package and was a missing archive.
          /opt/aqt/bin/python -m aqt install-qt linux desktop 6.9.2 linux_gcc_64 \
            --archives qtbase qtdeclarative qtshadertools icu --outputdir /opt/Qt
          for want in include/QtWidgets/QApplication lib/libQt6Widgets.so.6 \
                      lib/libQt6QuickWidgets.so.6 lib/libQt6Qml.so.6 \
                      plugins/platforms/libqoffscreen.so; do
            test -e "/opt/Qt/6.9.2/gcc_64/$want" || {
              echo "aqtinstall did not deliver $want for Qt 6.9.2 linux_gcc_64."
              echo "Nothing in this repository selects that: the Qt mirrors retire"
              echo "point releases and aqtinstall is installed unpinned above."
              exit 1
            }
          done

      - name: Build the load harness
        run: |
          set -euo pipefail
          QT=/opt/Qt/6.9.2/gcc_64
          clang++ -std=c++17 -Wall -Wextra -fPIC \
            -I$QT/include -I$QT/include/QtCore -I$QT/include/QtGui \
            -I$QT/include/QtWidgets \
            app/tests/ui_plugin_load_test.cpp \
            -L$QT/lib -lQt6Widgets -lQt6Gui -lQt6Core -ldl \
            -Wl,-rpath,$QT/lib -o ui_plugin_load_test
          test -x ui_plugin_load_test

      - name: The shipped linux-amd64 variant loads
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -euo pipefail
          tar tzf app/lp-0003-airdrop.lgx > pkg.list
          grep -qxF 'variants/linux-amd64/lp_0003_airdrop.so' pkg.list \
            || { echo "app/lp-0003-airdrop.lgx ships no linux-amd64 variant"; cat pkg.list; exit 1; }
          rm -f pkg.list
          mkdir -p unpacked && tar xzf app/lp-0003-airdrop.lgx -C unpacked variants/linux-amd64
          export QT_PLUGIN_PATH=/opt/Qt/6.9.2/gcc_64/plugins
          # LD_LIBRARY_PATH, and it is not redundant with the harness's -rpath.
          # Modern ld emits RUNPATH rather than RPATH, and RUNPATH is not searched
          # for a dependency's own dependencies — so the harness finds Qt and the
          # plugin it loads does not. Measured: with qtdeclarative installed and
          # verified on disk by the step above, the plugin still reported
          # `libQt6QuickWidgets.so.6: cannot open shared object file`, which reads
          # as a missing library and was a missing search path.
          export LD_LIBRARY_PATH=/opt/Qt/6.9.2/gcc_64/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}
          ./ui_plugin_load_test unpacked/variants/linux-amd64/lp_0003_airdrop.so lp_0003_airdrop 2>&1 | tee load.out
          # The banner is printed only when every assertion ran. Asserted here as
          # well, because a harness that dies early still exits non-zero and this
          # step would already fail — but a harness that is silently rebuilt into
          # something that prints nothing would not.
          grep -q "assertions, all of them ran" load.out \
            || { echo "the harness did not report a complete run"; exit 1; }
