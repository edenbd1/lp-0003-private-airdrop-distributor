name: e2e vs local sequencer

# The full LP-0003 lifecycle against a REAL LEZ sequencer in standalone mode,
# with RISC0_DEV_MODE=0 — deploy both programs, commit a distribution, submit a
# real privacy-preserving claim whose Risc0 receipt the sequencer verifies, then
# read the resulting marker PDA back off that chain and check its owner.
#
# Separate from the main CI workflow on purpose. That one is a few minutes and
# gates every push; this one builds the whole logos-execution-zone workspace and
# then generates an actual proof, so it takes about an hour and a quarter. Both
# run on every commit to the default branch; only one of them can be fast, and
# only the fast one is a required check.

on:
  # On every commit that reaches the default branch, and on every release tag, so
  # a given revision has its own run of this job rather than inheriting one from
  # whichever nightly happened to catch it. That is the difference between "this
  # project runs a standalone-sequencer e2e" and "this commit was e2e-tested",
  # and only the second is checkable from a permalink.
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
  schedule:
    # 04:40 UTC daily. Nothing depends on the hour; it is off-peak for runners.
    # Kept alongside the push trigger: it is what catches upstream drift on a
    # commit that has not changed, which is how this job has actually gone red.
    - cron: '40 4 * * *'

  # No `paths` filter, on purpose. A path filter would mark this check "skipped"
  # on a docs-only commit, and a skipped check is indistinguishable, from the
  # outside, from a test that was never run. Measured over the 18 green runs in this
  # workflow's history: 27-126 min, median 73, on a public-repo runner, which is free, so the whole cost of
  # running it unconditionally is wall-clock nobody is waiting on: `ci.yml` is
  # the few-minute gate, and this one is not a required status check.

concurrency:
  # Keyed on the commit, not the ref, and never cancelled. On a ref key, a second
  # push to main would cancel the first commit's run — and a cancelled run reads
  # as "did not run" to anyone auditing the history, which is exactly the claim
  # this job exists to make unambiguous.
  group: e2e-local-sequencer-${{ github.sha }}
  cancel-in-progress: false

env:
  # The revision this was developed and verified against — v0.2.4. Floating HEAD
  # would turn an upstream change into a red build here with no change of ours.
  LEZ_REV: 47eba25
  CARGO_TERM_COLOR: always

jobs:
  e2e:
    name: lifecycle vs standalone sequencer
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Check out logos-execution-zone
        run: |
          git clone --filter=blob:none https://github.com/logos-blockchain/logos-execution-zone _external/lez
          git -C _external/lez checkout "$LEZ_REV"
          echo "LEZ at $(git -C _external/lez rev-parse --short HEAD)"

      - uses: dtolnay/rust-toolchain@stable

      # The LEZ workspace is large and its build dominates this job. Keyed on the
      # pinned revision, so it is a cache hit on every run until LEZ_REV changes.
      - name: Cache the LEZ build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            _external/lez/target
          key: lez-${{ runner.os }}-${{ env.LEZ_REV }}-${{ hashFiles('_external/lez/Cargo.lock') }}
          restore-keys: lez-${{ runner.os }}-${{ env.LEZ_REV }}-

      - name: Install r0vm
        # rzup downloads r0vm through api.github.com unauthenticated, so it is
        # rate-limited by runner IP and shared with everyone else on that host.
        # It failed once here with "Remote error: api.github.com" on the tag
        # push while the same commit went green from the branch push minutes
        # earlier — a red run on the pinned commit, from a network flake.
        #
        # Three attempts with backoff, and GITHUB_TOKEN so the download is
        # authenticated rather than anonymous. It still fails the job if all
        # three fail: this proof cannot be built without r0vm, and a job that
        # continued without it would be reporting green on nothing.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -L https://risczero.com/install | bash
          echo "$HOME/.risc0/bin" >> "$GITHUB_PATH"
          for attempt in 1 2 3; do
            if "$HOME/.risc0/bin/rzup" install r0vm 3.0.5; then
              exit 0
            fi
            echo "rzup attempt $attempt failed; retrying in $((attempt * 20))s"
            sleep $((attempt * 20))
          done
          echo "rzup could not install r0vm after three attempts" >&2
          exit 1

      # v0.2.4 builds lez/keycard_wallet, which links against PC/SC. Taken from
      # LEZ's own ci.Dockerfile rather than assembled one package per failure.
      - name: System libraries LEZ needs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang libclang-dev libssl-dev pkg-config \
            libpcsclite-dev curl git jq python3-dev

      - name: Build the vendored spel (ported to LEZ v0.2.4)
        # spel has no release targeting a current LEZ, so vendor/spel carries the
        # upstream v0.6.0 sources repinned to lee_core 47eba25 and ported to the
        # v0.2.4 API (the `vpk` private-PDA arg, the async multi-sequencer
        # WalletCore). Install that; the published v0.6.0 spel does not build
        # against it. `spel --help` exits 1, so confirm the binary is on PATH
        # instead.
        #
        # `--locked` is load-bearing: unlike `cargo build`, `cargo install`
        # ignores the committed Cargo.lock and re-resolves to the newest
        # compatible dependencies. That is why this job went red on a schedule
        # with no change of ours — an upstream release, not our code.
        run: |
          cargo install --path vendor/spel/spel-cli --locked
          command -v spel

      - name: Build the standalone sequencer and the wallet
        working-directory: _external/lez
        run: |
          cargo build --release --features standalone -p sequencer_service
          cargo build --release -p wallet

      - name: Full lifecycle against it
        env:
          RISC0_DEV_MODE: 0
        run: |
          # One claim rather than the full public set: the integration surface is
          # identical and the proof is the expensive part. A reviewer wanting more
          # runs the same script with COUNT1/COUNT2 set.
          COUNT1=1 COUNT2=0 ./scripts/e2e-local-sequencer.sh

      - name: Sequencer log on failure
        if: failure()
        run: |
          find /tmp -name 'sequencer.log' -newermt '-2 hours' -exec tail -100 {} \; 2>/dev/null || true
