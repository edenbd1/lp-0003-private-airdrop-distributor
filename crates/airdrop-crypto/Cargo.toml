[package]
name = "airdrop-crypto"
description = "Encrypted eligibility bundles for LP-0003: a distributor encrypts each recipient's claim data to a key derived from the recipient's secret, so the bundle can be published without revealing who is eligible or their allocations."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
airdrop-core = { path = "../airdrop-core" }
# X25519 for the recipient's encryption key, ChaCha20-Poly1305 for the row AEAD.
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
getrandom = "0.2"

[dev-dependencies]
serde_json = "1"
hex = "0.4"
