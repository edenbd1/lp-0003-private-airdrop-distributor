[package]
name = "airdrop-cli"
description = "Host tooling for LP-0003: build a distribution's eligibility tree, generate recipient claim witnesses, and emit the SPEL claim arguments."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "airdrop"
path = "src/bin/airdrop.rs"

[dependencies]
airdrop-core = { path = "../airdrop-core" }
airdrop-crypto = { path = "../airdrop-crypto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
sha2 = "0.10"
# For encoding the witness exactly as the guest's read_lee_inputs expects it.
risc0-zkvm = { version = "3.0.5", default-features = false }
getrandom = "0.2"
