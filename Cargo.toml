[workspace]
resolver = "2"
members = [
    "crates/airdrop-core",
    "crates/airdrop-cli",
]
# Guest crates build on the riscv32im-risc0-zkvm-elf toolchain and are excluded
# from the host workspace, same layout as the LP-0005 project this reuses.
exclude = [
    "_external",
]

[workspace.dependencies]
sha2 = { version = "0.10", default-features = false }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde-big-array = { version = "0.5", default-features = false }
hex = { version = "0.4", default-features = false, features = ["alloc"] }
anyhow = "1"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
